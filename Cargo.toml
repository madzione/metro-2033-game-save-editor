[package]
name = "metro-2033-redux-save-editor"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Inspect, edit and repack Metro 2033 Redux (4A engine) save games"
authors = ["Madzione"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/madzione/metro-2033-game-save-editor"
keywords = ["metro-2033", "save-editor", "savegame", "4a-engine"]
categories = ["command-line-utilities", "games"]
# Keep personal save games and other local files out of the package.
include = ["/src", "/data", "/tests", "/README.md", "/LICENSE"]

[lib]
name = "metro_save"
path = "src/lib.rs"

[[bin]]
name = "metro-2033-redux-save-editor"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
lz4_flex = "0.11"
eframe = { version = "0.36", optional = true }
rfd = { version = "0.17", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
